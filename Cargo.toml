[workspace]
resolver = "2"
members = ["crates/scada-model", "crates/scada-runtime", "crates/scada-historian", "crates/scada-host", "crates/scada-alarm", "crates/scada-scenario"]
exclude = ["apps/banto-scada/src-tauri"]

[workspace.package]
version = "0.37.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
jsonschema = { version = "0.33", default-features = false }

# banto-industrial main 99b0b9c3 (v0.3.0-alpha.4 + #1344・#1345・#1349; no tag yet).
# Same rev in crates/scada-host and apps/banto-scada/src-tauri.
banto-tagclient = { git = "https://github.com/tyaro/banto-industrial.git", rev = "99b0b9c35a069aa7513e2f3e611b281a5b68b2a6" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util"] }
