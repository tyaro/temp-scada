[workspace]
resolver = "2"
members = ["crates/scada-model", "crates/scada-runtime"]

[workspace.package]
version = "0.35.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
jsonschema = { version = "0.33", default-features = false }

banto-tagclient = { git = "https://github.com/tyaro/banto-industrial.git", rev = "33410f6d25d36559c5ce81375e243eb6f3e85038" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util"] }
