[workspace]
resolver = "2"
members = ["crates/scada-model", "crates/scada-runtime"]

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }

banto-tagclient = { git = "https://github.com/tyaro/banto-industrial.git", rev = "c4a61bc08ddf6d03fa56974bf1fcad08d12cbb5a" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util"] }
