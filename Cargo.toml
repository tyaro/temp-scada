[workspace]
resolver = "2"
members = ["crates/scada-model", "crates/scada-runtime", "crates/scada-historian", "crates/scada-host", "crates/scada-alarm"]
exclude = ["apps/banto-scada/src-tauri"]

[workspace.package]
version = "0.37.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
jsonschema = { version = "0.33", default-features = false }

# banto-industrial v0.3.0-alpha.2 (tag commit; the tag is an annotated tag, no release).
# Same rev in crates/scada-host and apps/banto-scada/src-tauri.
banto-tagclient = { git = "https://github.com/tyaro/banto-industrial.git", rev = "c0ac52063dbb3731f1e08207ed8a39bec92f423a" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util"] }
