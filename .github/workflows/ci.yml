name: SCADA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            merge_base=$(git merge-base "$BASE" "$HEAD")
            git diff --name-only -z "$merge_base" "$HEAD" > "$RUNNER_TEMP/changed-files"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id --name-only -z -r "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git diff --name-only -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
          fi
          docs_only=true
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          if (( count == 0 )); then docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Changed files: $count; docs only: $docs_only"

  docs:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node scripts/check-doc-links.mjs

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p scada-model -- validate examples/minimal.project.json
      - run: cargo run --locked -p scada-model -- validate examples/process.project.json
      - run: cargo run --locked -p scada-model -- validate examples/tag-binding.project.json

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/4 --workers=2
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scada-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  check:
    if: ${{ always() }}
    needs: [changes, docs, frontend, rust, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          if [[ "$DOCS_ONLY" == true ]]; then
            test "$FRONTEND_RESULT" = skipped
            test "$RUST_RESULT" = skipped
            test "$E2E_RESULT" = skipped
          else
            test "$FRONTEND_RESULT" = success
            test "$RUST_RESULT" = success
            test "$E2E_RESULT" = success
          fi
