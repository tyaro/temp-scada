[package]
name = "scada-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banto-hub-bootstrap = { git = "https://github.com/tyaro/banto-industrial.git", rev = "33410f6d25d36559c5ce81375e243eb6f3e85038" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
banto-tagclient.workspace = true
scada-historian = { path = "../scada-historian" }
scada-model = { path = "../scada-model" }
scada-alarm = { path = "../scada-alarm" }
scada-runtime = { path = "../scada-runtime" }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
# Banto v7.0.0 (tag commit). The admin services own users / settings / audit;
# the host only re-validates the desktop session and maps roles.
banto-admin-services = { git = "https://github.com/tyaro/banto.git", rev = "27004fed6a0c2c76cbf39f2acdf702abe5054c20" }
banto-core = { git = "https://github.com/tyaro/banto.git", rev = "27004fed6a0c2c76cbf39f2acdf702abe5054c20" }
banto-storage = { git = "https://github.com/tyaro/banto.git", rev = "27004fed6a0c2c76cbf39f2acdf702abe5054c20", features = ["sqlite"] }
tokio.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

[features]
# Test hooks for the desktop host's command tests (`apps/banto-scada/src-tauri`).
# Never enabled by a product build.
test-support = ["scada-runtime/test-support"]

[dev-dependencies]
# A pristine native owner for the registry gate tests.
scada-runtime = { path = "../scada-runtime", features = ["test-support"] }
# A loopback Hub for the recording setup tests.
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
