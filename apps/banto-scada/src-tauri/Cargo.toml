[package]
name = "banto-scada-desktop"
version = "0.37.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# One process per terminal, whatever the mode (Runtime mode design §7).
tauri-plugin-single-instance = "2"
scada-host = { path = "../../../crates/scada-host" }
scada-runtime = { path = "../../../crates/scada-runtime" }
scada-model = { path = "../../../crates/scada-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

# The alarm buzzer plays an in-memory WAV with PlaySound (design §6); a refused
# command line is shown with MessageBoxW (Runtime mode design §3).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
banto-hub-bootstrap = { git = "https://github.com/tyaro/banto-industrial.git", rev = "6a08efbb76b50e6094f88f6dc91c46b8c4a8ecc3" }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
# A recording gate over a pristine native owner for the command tests.
scada-host = { path = "../../../crates/scada-host", features = ["test-support"] }
scada-runtime = { path = "../../../crates/scada-runtime", features = ["test-support"] }
