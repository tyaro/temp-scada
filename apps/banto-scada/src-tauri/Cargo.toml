[package]
name = "banto-scada-desktop"
version = "0.37.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
scada-host = { path = "../../../crates/scada-host" }
scada-runtime = { path = "../../../crates/scada-runtime" }
scada-model = { path = "../../../crates/scada-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
banto-hub-bootstrap = { git = "https://github.com/tyaro/banto-industrial.git", rev = "33410f6d25d36559c5ce81375e243eb6f3e85038" }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
# A recording gate over a pristine native owner for the command tests.
scada-host = { path = "../../../crates/scada-host", features = ["test-support"] }
scada-runtime = { path = "../../../crates/scada-runtime", features = ["test-support"] }
